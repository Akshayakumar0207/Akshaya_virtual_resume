<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#grad)" />

  <!-- Shine overlay -->
  <circle cx="32" cy="32" r="30" fill="url(#shine)" />

  <!-- Subtle ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <!-- Letter A - bold, geometric, centered -->
  <text x="32" y="44"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="36"
    font-weight="bold"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1"
    style="text-shadow: 0 2px 8px rgba(0,0,0,0.3)">A</text>

  <!-- Small accent dot bottom-right -->
  <circle cx="46" cy="46" r="4" fill="#f0abfc" opacity="0.85" />
</svg>
